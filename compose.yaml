services:
  app:
    build: .
    container_name: shopflow-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 容器内通过 Compose 服务名访问 Redis；覆盖 .env 中的 localhost
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - shopflow-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: shopflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ShopFlow
      MYSQL_USER: shopflow_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shopflow-network
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: shopflow-redis
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shopflow-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  shopflow-network:
    driver: bridge
